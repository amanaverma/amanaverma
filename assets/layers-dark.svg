    <rect x="20" y="24" width="26" height="2" rx="1" fill="url(#accent)"/>
    <text x="20" y="56" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#f0f6fc">Backend</text>
    <text x="20" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#64748b">Node services,</text>
