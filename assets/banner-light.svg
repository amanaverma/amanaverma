<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Aman Verma — smart contract engineer, DeFi">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f4f7fb"/>
      <stop offset="100%" stop-color="#eef2f9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#0f172a" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <ellipse cx="1010" cy="150" rx="330" ry="230" fill="url(#glow)"/>
  <rect x="0" y="0" width="6" height="320" fill="url(#accent)"/>

  <!-- lending flow motif: supply -> market -> oracle -> borrow -->
  <g transform="translate(830 96)" fill="none" stroke-linecap="round">
    <path d="M46 32 H132 M132 32 C160 32 160 128 188 128 M234 128 C262 128 287 106 287 54"
          stroke="url(#accent)" stroke-width="2" stroke-opacity="0.5"/>
    <g stroke="url(#accent)" stroke-width="2">
      <rect x="0" y="8" width="46" height="46" rx="10" fill="#ffffff" stroke-opacity="0.85"/>
      <rect x="132" y="8" width="46" height="46" rx="10" fill="#ffffff" stroke-opacity="0.85"/>
      <rect x="264" y="8" width="46" height="46" rx="10" fill="#ffffff" stroke-opacity="0.85"/>
      <rect x="188" y="104" width="46" height="46" rx="10" fill="#ffffff" stroke-opacity="0.85"/>
    </g>
    <g fill="#0284c7" stroke="none">
      <circle cx="23" cy="31" r="4"/>
      <circle cx="155" cy="31" r="4"/>
      <circle cx="287" cy="31" r="4"/>
      <circle cx="211" cy="127" r="4"/>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11"
       fill="#0369a1" fill-opacity="0.9" stroke="none" text-anchor="middle">
      <text x="23" y="74">supply</text>
      <text x="155" y="74">market</text>
      <text x="287" y="74">borrow</text>
      <text x="211" y="170">oracle</text>
    </g>
  </g>

  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="132" fill="#0f172a" font-size="54" font-weight="700" letter-spacing="-1">Aman Verma</text>
    <text x="72" y="180" fill="#475569" font-size="23" font-weight="500">Smart contract engineer · DeFi</text>
    <text x="72" y="232" fill="#64748b" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Solidity · production protocols · EVM</text>
  </g>

  <g transform="translate(72 258)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
    <g fill="#ffffff" stroke="#0284c7" stroke-opacity="0.35">
      <rect x="0" y="0" width="80" height="30" rx="15"/>
      <rect x="92" y="0" width="78" height="30" rx="15"/>
      <rect x="182" y="0" width="56" height="30" rx="15"/>
      <rect x="250" y="0" width="78" height="30" rx="15"/>
      <rect x="340" y="0" width="104" height="30" rx="15"/>
    </g>
    <g fill="#0369a1" text-anchor="middle">
      <text x="40" y="20">Solidity</text>
      <text x="131" y="20">Foundry</text>
      <text x="210" y="20">EVM</text>
      <text x="289" y="20">Hardhat</text>
      <text x="392" y="20">TypeScript</text>
    </g>
  </g>
</svg>
